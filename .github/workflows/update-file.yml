
name: Update RightMoveRX Videos

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Debug repository files
        run: |
          pwd
          ls -la
          find .github/workflows -maxdepth 1 -type f -print
          python --version

      - name: Run Python scraper
        env:
          YOUTUBE_CHANNEL_URL: https://www.youtube.com/@RightMoveRX/videos
        run: python scraper.py

      - name: Validate JSON
        run: python -m json.tool videos.json > /dev/null

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos.json

          if ! git diff --cached --quiet; then
            git commit -m "Update video database"
            git push
          else
            echo "No changes to commit."
          fi
